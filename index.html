<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f1117" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>BLE Voice</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #222536;
      --border: rgba(255,255,255,0.08);
      --accent: #6c8fff;
      --accent-glow: rgba(108,143,255,0.15);
      --green: #3ecf6e;
      --green-bg: rgba(62,207,110,0.12);
      --red: #ff5f5f;
      --red-bg: rgba(255,95,95,0.12);
      --amber: #ffb23e;
      --amber-bg: rgba(255,178,62,0.12);
      --text: #e8eaf0;
      --text2: #8891aa;
      --text3: #555d75;
      --radius: 16px;
      --radius-sm: 10px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }


    /* CENTER CARD */
    .center-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start; 
      padding: 24px;
      gap: 16px;
      min-height: 0;
      overflow-y: auto;
    }

    .connect-card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 24px;
      text-align: center;
    }

    .ble-icon-wrap {
      width: 72px;
      height: 72px;
      background: var(--accent-glow);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      border: 1.5px solid rgba(108,143,255,0.3);
      transition: all 0.3s;
    }

    .ble-icon-wrap.connected {
      background: var(--green-bg);
      border-color: rgba(62,207,110,0.4);
    }

    .ble-icon-wrap svg {
      width: 32px;
      height: 32px;
    }

    .connect-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }

    .connect-desc {
      font-size: 14px;
      color: var(--text2);
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .device-name {
      font-size: 13px;
      color: var(--accent);
      background: var(--accent-glow);
      border: 1px solid rgba(108,143,255,0.2);
      border-radius: 8px;
      padding: 8px 16px;
      margin-bottom: 16px;
      word-break: break-all;
      display: none;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 16px;
      border-radius: var(--radius-sm);
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: -0.2px;
    }

    .btn:active { transform: scale(0.97); }

    .btn-connect {
      background: var(--accent);
      color: #fff;
    }

    .btn-disconnect {
      background: var(--red-bg);
      color: var(--red);
      border: 1px solid rgba(255,95,95,0.2);
      display: none;
    }

    /* CONFIG & COMMAND ROWS */
    .config-row {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      display: none;
    }

    .config-row.visible { display: block; }

    .config-label {
      font-size: 12px;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .config-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .config-item label {
      display: block;
      font-size: 12px;
      color: var(--text2);
      margin-bottom: 5px;
    }

    .config-item select,
    .config-item input[type="range"] {
      width: 100%;
    }

    .config-item select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 10px;
      font-size: 13px;
    }

    .config-item .range-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .config-item input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }

    .config-item .range-val {
      font-size: 13px;
      color: var(--accent);
      min-width: 28px;
      text-align: right;
    }

    /* COMMAND INPUT */
    .input-group {
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      width: 100%;
    }

    .cmd-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 14px 44px 14px 14px;
      font-size: 14px;
      transition: border-color 0.15s;
    }

    .cmd-input:focus {
      border-color: var(--accent);
      outline: none;
    }

    .mic-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: var(--text2);
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .mic-btn:hover { color: var(--text); background: rgba(255,255,255,0.05); }

    .mic-btn.recording {
      color: var(--red);
      background: var(--red-bg);
      animation: pulse-red 1.2s infinite;
    }

    @keyframes pulse-red {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,95,95,0.3); }
      50% { transform: scale(1.05); box-shadow: 0 0 0 6px rgba(255,95,95,0); }
    }

    .btn-send {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      border-radius: var(--radius-sm);
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      background: var(--accent);
      color: #fff;
    }
    .btn-send:active { transform: scale(0.98); }

    .btn-send:disabled {
      background: var(--surface2);
      color: var(--text3);
      cursor: not-allowed;
      transform: none;
      border: 1px solid var(--border);
    }

    /* LOG / MESSAGES */
    .log-area {
      flex-shrink: 0;
      padding: 0 20px 12px;
    }

    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .log-label {
      font-size: 12px;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 600;
    }

    .log-clear {
      font-size: 12px;
      color: var(--text3);
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      transition: color 0.2s;
    }

    .log-clear:hover { color: var(--text2); }

    .log-scroll {
      height: 160px;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .log-scroll::-webkit-scrollbar { width: 4px; }
    .log-scroll::-webkit-scrollbar-track { background: transparent; }
    .log-scroll::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 4px; }

    .log-entry {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      animation: fadeSlide 0.2s ease;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .log-time {
      font-size: 11px;
      color: var(--text3);
      flex-shrink: 0;
      padding-top: 1px;
      font-variant-numeric: tabular-nums;
    }

    .log-msg {
      font-size: 13px;
      color: var(--text2);
      line-height: 1.4;
      flex: 1;
    }

    .log-msg.ble { color: var(--accent); }
    .log-msg.tts { color: var(--green); }
    .log-msg.err { color: var(--red); }
    .log-msg.warn { color: var(--amber); }

    .log-badge {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .log-badge.ble { background: var(--accent-glow); color: var(--accent); }
    .log-badge.tts { background: var(--green-bg); color: var(--green); }
    .log-badge.err { background: var(--red-bg); color: var(--red); }
    .log-badge.sys { background: rgba(255,255,255,0.06); color: var(--text3); }

    /* TTS wave animation */
    .wave-wrap {
      display: none;
      align-items: center;
      gap: 3px;
      height: 20px;
    }

    .wave-wrap.speaking { display: flex; }

    .wave-bar {
      width: 3px;
      border-radius: 2px;
      background: var(--green);
      animation: wave 0.6s ease-in-out infinite alternate;
    }

    .wave-bar:nth-child(1) { animation-delay: 0s;    height: 6px; }
    .wave-bar:nth-child(2) { animation-delay: 0.1s;  height: 14px; }
    .wave-bar:nth-child(3) { animation-delay: 0.2s;  height: 20px; }
    .wave-bar:nth-child(4) { animation-delay: 0.15s; height: 12px; }
    .wave-bar:nth-child(5) { animation-delay: 0.05s; height: 7px; }

    @keyframes wave {
      from { transform: scaleY(0.3); }
      to   { transform: scaleY(1); }
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 100px;
      font-size: 14px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: all 0.3s;
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div class="center-area">

    <div class="connect-card">
      <div class="ble-icon-wrap" id="bleIconWrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="color: var(--accent)" id="bleIconConnected" class="hidden">
          <path d="M6.5 6.5l11 11M17.5 6.5L12 12l5.5 5.5M6.5 6.5L12 12l-5.5 5.5"/>
        </svg>
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" id="bleIconDefault" style="color: var(--accent)">
          <polyline points="6.5 6.5 17.5 17.5 12 23 12 1 17.5 6.5 6.5 17.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <div id="connectTitle" class="connect-title">Connect to BLE Device</div>
      <div id="connectDesc" class="connect-desc">Tap to scan for nearby BLE devices</div>

      <div class="device-name" id="deviceName"></div>

      <button class="btn btn-connect" id="btnConnect" onclick="connectBLE()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6.5 6.5 17.5 17.5 12 23 12 1 17.5 6.5 6.5 17.5"/></svg>
        Scan & Connect
      </button>
      <button class="btn btn-disconnect" id="btnDisconnect" onclick="disconnectBLE()">
        Disconnect
      </button>
    </div>

    <!-- BUTTON ENABLE AUDIO -->
    <div class="config-row" id="audioPollingRow">
      <div class="config-label">Automatic Telemetry</div>
      <button class="btn" id="btnAudioPolling" onclick="toggleAudioPolling()" style="background: var(--surface2); border: 1px solid var(--border); color: var(--text);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px; color: var(--accent);">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
        Enable Audio
      </button>
    </div>

    <!-- BUTTON ENABLE WIFI -->
    <div class="config-row" id="wifiRow">
      <div class="config-label">Wi-Fi Control</div>
      <button class="btn" id="btnWifi" onclick="toggleWifi()" style="background: var(--surface2); border: 1px solid var(--border); color: var(--text);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px; color: var(--accent);">
          <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
          <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
        Enable WiFi
      </button>

      <!-- WIFI INSTRUCTIONS -->
      <div id="wifiInstructions" style="display: none; margin-top: 16px; padding: 16px; background: rgba(0,0,0,0.2); border-radius: 8px; border: 1px solid var(--border);">
        <p style="font-size: 13px; color: var(--text2); margin-bottom: 12px;">Connect to the network below and access settings:</p>
        <p style="font-size: 15px; color: var(--text); margin-bottom: 6px;">SSID: <strong style="color: var(--accent);">MY_AP_SSID</strong></p>
        <p style="font-size: 15px; color: var(--text); margin-bottom: 16px;">Password: <strong style="color: var(--accent);">MY_AP_PASSPHRASE</strong></p>
        
        <a href="http://192.168.10.10" target="_blank" class="btn" style="background: var(--accent); color: #fff; text-decoration: none; padding: 12px; font-size: 14px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          Module Settings
        </a>
      </div>
    </div>

    <!-- SEND COMMAND -->
    <div class="config-row" id="commandRow">
      <div class="config-label">Send BLE Command</div>
      <div class="input-group">
        <input type="text" class="cmd-input" id="cmdInput" placeholder="Type something (e.g., LED0 ON)..." onkeydown="if(event.key === 'Enter') sendBLECommand()">
        <button class="mic-btn" id="micBtn" onclick="startSpeechRecognition()" title="Record for 5 seconds">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>
      </div>
      <button class="btn-send" id="btnSend" onclick="sendBLECommand()">        
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
        Send Command
      </button>
    </div>

    <!-- TTS CONFIG -->
    <div class="config-row" id="configRow">
      <div class="config-label">Voice Settings</div>
      <div class="config-grid">
        <div class="config-item" style="grid-column: 1/-1;">
          <label>Voice</label>
          <select id="voiceSelect" onchange="updateVoice()"></select>
        </div>
        <div class="config-item">
          <label>Speed</label>
          <div class="range-row">
            <input type="range" min="0.5" max="2" step="0.1" value="1" id="rateSlider" oninput="updateRate(this)">
            <span class="range-val" id="rateVal">1.0</span>
          </div>
        </div>
        <div class="config-item">
          <label>Volume</label>
          <div class="range-row">
            <input type="range" min="0" max="1" step="0.1" value="1" id="volSlider" oninput="updateVol(this)">
            <span class="range-val" id="volVal">1.0</span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div class="log-area">
    <div class="log-header">
      <div style="display:flex;align-items:center;gap:10px">
        <span class="log-label">Received Messages</span>
        <div class="wave-wrap" id="waveWrap">
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>
      </div>
      <button class="log-clear" onclick="clearLog()">Clear</button>
    </div>
    <div class="log-scroll" id="logScroll"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ─── STATE ───────────────────────────────────────────────────────────────
    let bleDevice = null;
    let bleServer = null;
    let bleChar = null; // Notify
    let bleWriteChar = null; // Write
    let wakeLock = null;
    let ttsQueue = [];
    let isSpeaking = false;
    let voices = [];
    let recognition = null;
    let recognitionTimer = null;
    let audioPollingInterval = null;
    let isAudioPollingActive = false;
    let isWifiActive = false;

    const ttsConfig = { rate: 1.0, pitch: 1.0, volume: 1.0, voice: null };

    // Built-in UUIDs (Hidden from UI)
    const DEFAULT_SERVICE  = '0000aabb-0000-1000-8000-0026bb765291';
    const DEFAULT_NOTIFY   = '00001bb1-0000-1000-8000-00805f9b34fb';
    const DEFAULT_WRITE    = '00001aa1-0000-1000-8000-00805f9b34fb';

    // ─── INIT ─────────────────────────────────────────────────────────────────
    window.addEventListener('load', () => {
      if (!('bluetooth' in navigator)) {
        addLog('Web Bluetooth is not supported. Use Chrome Android.', 'err');
        document.getElementById('btnConnect').disabled = true;
        document.getElementById('btnConnect').textContent = 'Bluetooth not supported';
        toast('⚠️ Use Chrome Android for BLE');
      } else {
        addLog('Ready. Waiting for BLE connection.', 'sys');
      }

      loadVoices();
      speechSynthesis.addEventListener('voiceschanged', loadVoices);
    });

    // ─── VOICES ──────────────────────────────────────────────────────────────
    function loadVoices() {
      voices = speechSynthesis.getVoices();
      const sel = document.getElementById('voiceSelect');
      sel.innerHTML = '';
      
      const en = voices.filter(v => v.lang.startsWith('en'));
      const others = voices.filter(v => !v.lang.startsWith('en'));
      
      const addGroup = (label, list) => {
        if (!list.length) return;
        const g = document.createElement('optgroup');
        g.label = label;
        list.forEach((v, i) => {
          const o = document.createElement('option');
          o.value = v.name;
          o.textContent = `${v.name} (${v.lang})`;
          g.appendChild(o);
        });
        sel.appendChild(g);
      };
      
      addGroup('English', en);
      addGroup('Others', others);
      
      if (en.length) ttsConfig.voice = en[0];
    }

    function updateVoice() {
      const name = document.getElementById('voiceSelect').value;
      ttsConfig.voice = voices.find(v => v.name === name) || null;
    }

    function updateRate(el) {
      ttsConfig.rate = parseFloat(el.value);
      document.getElementById('rateVal').textContent = ttsConfig.rate.toFixed(1);
    }

    function updateVol(el) {
      ttsConfig.volume = parseFloat(el.value);
      document.getElementById('volVal').textContent = ttsConfig.volume.toFixed(1);
    }

    // ─── BLE ──────────────────────────────────────────────────────────────────
    async function connectBLE() {
      if (!('bluetooth' in navigator)) return;

      const serviceUUID = DEFAULT_SERVICE;

      setStatus('connecting', 'Connecting...');
      addLog('Opening BLE device selector...', 'sys');

      try {
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [ { name: 'BLE_THROUGHPUT' } ],
          optionalServices: [serviceUUID]
        });
      } catch(e) {
        if (e.name === 'NotFoundError') {
          try {
            bleDevice = await navigator.bluetooth.requestDevice({
              acceptAllDevices: true,
              optionalServices: [serviceUUID]
            });
          } catch(e2) {
            setStatus('idle', 'Disconnected');
            addLog('No device selected.', 'warn');
            return;
          }
        } else {
          setStatus('error', 'Error');
          addLog('Error searching: ' + e.message, 'err');
          return;
        }
      }

      addLog(`Device: "${bleDevice.name || 'Unnamed'}" — connecting...`, 'ble');
      bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

      try {
        bleServer = await bleDevice.gatt.connect();
        addLog('GATT connected. Searching for service...', 'ble');

        const service = await bleServer.getPrimaryService(serviceUUID);
        
        bleChar = await service.getCharacteristic(DEFAULT_NOTIFY);
        bleWriteChar = await service.getCharacteristic(DEFAULT_WRITE);

        await bleChar.startNotifications();
        bleChar.addEventListener('characteristicvaluechanged', onNotification);

        setStatus('connected', 'Connected');
        showConnectedUI(bleDevice.name || 'BLE Device');
        addLog('Notifications active. Waiting for data...', 'tts');
        toast('✅ Connected! Waiting for messages...');
        acquireWakeLock();
      } catch(e) {
        setStatus('error', 'Failed');
        addLog('Connection error: ' + e.message, 'err');
        toast('❌ Connection failed');
      }
    }

    function onNotification(event) {
      const decoder = new TextDecoder('utf-8');
      const value = decoder.decode(event.target.value).trim();
      if (!value) return;

      const now = new Date().toLocaleTimeString('en-US', { hour12: false });
      addLog(value, 'tts', now);
      enqueueTTS(value);
    }

    function onDisconnected() {
      setStatus('idle', 'Disconnected');
      showDisconnectedUI();
      addLog('Device disconnected.', 'warn');
      toast('🔴 Device disconnected');
      releaseWakeLock();
    }

    async function disconnectBLE() {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      }
    }

    // ─── BLE COMMANDS ────────────────────────────────────────────────────────
async function sendBLECommand() {
      const input = document.getElementById('cmdInput');
      const text = input.value.trim();
    
      if (!text) {
        return;
      }
    
      if (!bleWriteChar) {
        toast('⚠️ No active module connection');
        return;
      }

      const lowerText = text.toLowerCase();
      
      // Intercepts wi-fi commands
      if (lowerText === "enable wifi") {
        if (!isWifiActive) await toggleWifi();
        input.value = '';
        return;
      } else if (lowerText === "disable wifi") {
        if (isWifiActive) await toggleWifi();
        input.value = '';
        return;
      }
      
      // Intercepts audio commands
      else if (lowerText === "enable audio") {
        if (!isAudioPollingActive) await toggleAudioPolling();
        input.value = '';
        return;
      } else if (lowerText === "disable audio") {
        if (isAudioPollingActive) await toggleAudioPolling();
        input.value = '';
        return;
      }
    
      try {
        await writeCommand(text);
        addLog(`Command sent: "${text}"`, 'sys');
        input.value = '';
      } catch (e) {
        addLog(`Error sending command: ${e.message}`, 'err');
        toast('❌ Failed to send data');
      }
    }

    async function writeCommand(text) {
      if (!bleWriteChar) {
        throw new Error('Write characteristic unavailable');
      }
      const data = new TextEncoder().encode(text);
      await bleWriteChar.writeValueWithResponse(data);
    }
 
    // ─── POLLING & WIFI ──────────────────────────────────────────────────────
    async function toggleAudioPolling() {
      const btn = document.getElementById('btnAudioPolling');
      
      if (isAudioPollingActive) {
        // --- DISABLE ---
        clearInterval(audioPollingInterval);
        audioPollingInterval = null;
        isAudioPollingActive = false;
        
        if (bleWriteChar) {
          try {
            const data = new TextEncoder().encode("disable audio");
            await bleWriteChar.writeValueWithResponse(data);
            addLog('Command sent: "disable audio"', 'sys');
          } catch (e) {
            addLog('Error sending disable audio: ' + e.message, 'err');
          }
        }
        
        btn.style.background = 'var(--surface2)';
        btn.style.color = 'var(--text)';
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px; color: var(--accent);"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg> Enable Audio`;
        
        toast('⏹️ Automatic telemetry disabled');
        addLog('Audio polling (30s) stopped.', 'sys');
      } else {
        // --- ENABLE ---
        if (!bleWriteChar) {
          toast('⚠️ Connect to the module first');
          return;
        }
        
        isAudioPollingActive = true;
        
        // Red Disable state
        btn.style.background = 'var(--red-bg)';
        btn.style.color = 'var(--red)';
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px; color: var(--red);"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg> Disable Audio`;
        
        toast('▶️ Telemetry started (30s)');
        addLog('Audio polling started. Requesting data every 30s...', 'sys');
        
        requestAudioData();
        
        audioPollingInterval = setInterval(() => {
          requestAudioData();
        }, 30000);
      }
    }

    async function toggleWifi() {
      const btn = document.getElementById('btnWifi');
      const instr = document.getElementById('wifiInstructions');
      
      if (isWifiActive) {
        // --- DISABLE ---
        if (bleWriteChar) {
          try {
            const data = new TextEncoder().encode("disable wifi");
            await bleWriteChar.writeValueWithResponse(data);
            addLog('Command sent: "disable wifi"', 'sys');
          } catch (e) {
            addLog('Error sending disable wifi: ' + e.message, 'err');
          }
        }
        
        isWifiActive = false;
        
        instr.style.display = 'none';
        btn.style.background = 'var(--surface2)';
        btn.style.color = 'var(--text)';
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px; color: var(--accent);"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg> Enable WiFi`;
        
        toast('📶 Wi-Fi disabled');
      } else {
        // --- ENABLE ---
        if (!bleWriteChar) {
          toast('⚠️ Connect to the module first');
          return;
        }
        
        try {
          const data = new TextEncoder().encode("enable wifi");
          await bleWriteChar.writeValueWithResponse(data);
          addLog('Command sent: "enable wifi"', 'sys');
        } catch (e) {
          addLog('Error sending enable wifi: ' + e.message, 'err');
          return;
        }

        isWifiActive = true;
        
        // Red Disable state
        instr.style.display = 'block';
        btn.style.background = 'var(--red-bg)';
        btn.style.color = 'var(--red)';
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px; color: var(--red);"><line x1="2" y1="2" x2="22" y2="22"></line><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg> Disable WiFi`;
        
        toast('📶 Wi-Fi enabled');
      }
    }

    async function requestAudioData() {
      if (!bleWriteChar) return;
      try {
        const data = new TextEncoder().encode("enable audio"); 
        await bleWriteChar.writeValueWithResponse(data);
        addLog('Command sent: "enable audio"', 'sys');
      } catch(e) {
        addLog('Polling error: ' + e.message, 'err');
      }
    }

    // ─── SPEECH RECOGNITION ──────────────────────────────────────────────────
function startSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        addLog('Speech recognition not supported in this browser.', 'warn');
        toast('⚠️ Microphone not supported');
        return;
      }

      const micBtn = document.getElementById('micBtn');
      const input = document.getElementById('cmdInput');
      const sendBtn = document.getElementById('btnSend'); // Capturamos o botão de envio

      if (micBtn.classList.contains('recording')) {
        stopSpeechRecognition();
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'en-US'; 
      recognition.interimResults = false; 
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        micBtn.classList.add('recording');
        sendBtn.disabled = true; // Desabilita e deixa o botão cinza
        toast('🎙️ Listening for 3 seconds...');
        
        // Timeout alterado para 3 segundos
        recognitionTimer = setTimeout(() => {
          stopSpeechRecognition();
          toast("⏳ Time's up, processing...");
        }, 3000);
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        input.value = transcript; 
        addLog(`Transcribed voice: "${transcript}"`, 'sys');
        
        // ENVIAR AUTOMATICAMENTE: Não precisa mais clicar no botão
        sendBLECommand();
      };

      recognition.onerror = (e) => {
        if (e.error !== 'aborted') {
          addLog('Microphone error: ' + e.error, 'err');
          toast('❌ Failed to capture audio');
        }
        sendBtn.disabled = false; // Reabilita em caso de erro
      };

      recognition.onend = () => {
        micBtn.classList.remove('recording');
        sendBtn.disabled = false; // Reabilita o botão ao terminar a captura
        
        if (recognitionTimer) {
          clearTimeout(recognitionTimer);
          recognitionTimer = null;
        }
      };

      try {
        recognition.start();
      } catch(e) {
        addLog('Error starting microphone: ' + e.message, 'err');
        sendBtn.disabled = false; // Reabilita se não conseguir ligar o mic
      }
    }

    // ─── TTS ──────────────────────────────────────────────────────────────────
    function enqueueTTS(text) {
      ttsQueue.push(text);
      if (!isSpeaking) processQueue();
    }

    function processQueue() {
      if (!ttsQueue.length) {
        isSpeaking = false;
        setWave(false);
        return;
      }
      isSpeaking = true;
      setWave(true);
      const text = ttsQueue.shift();
      const utt = new SpeechSynthesisUtterance(text);
      utt.rate   = ttsConfig.rate;
      utt.pitch  = ttsConfig.pitch;
      utt.volume = ttsConfig.volume;
      utt.lang   = 'en-US'; // TRANSLATED TO ENGLISH
      if (ttsConfig.voice) utt.voice = ttsConfig.voice;
      utt.onend = () => processQueue();
      utt.onerror = (e) => {
        addLog('TTS Error: ' + e.error, 'err');
        processQueue();
      };
      speechSynthesis.speak(utt);
    }

    // ─── WAKE LOCK ────────────────────────────────────────────────────────────
    async function acquireWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          addLog("Wake lock active (screen won't sleep).", 'sys');
        } catch(e) { /* silent */ }
      }
    }

    function releaseWakeLock() {
      if (wakeLock) { wakeLock.release(); wakeLock = null; }
    }

    // ─── UI HELPERS ──────────────────────────────────────────────────────────
    function setStatus(state, text) {
    }

    function showConnectedUI(name) {
      document.getElementById('deviceName').textContent = '📡 ' + name;
      document.getElementById('deviceName').style.display = 'block';
      document.getElementById('btnConnect').style.display = 'none';
      document.getElementById('btnDisconnect').style.display = 'flex';
      document.getElementById('connectTitle').textContent = 'Connected!';
      document.getElementById('connectDesc').textContent = 'Receiving and playing messages automatically.';
      document.getElementById('bleIconWrap').classList.add('connected');
      document.getElementById('configRow').classList.add('visible');
      document.getElementById('commandRow').classList.add('visible');
      document.getElementById('audioPollingRow').classList.add('visible');
      document.getElementById('wifiRow').classList.add('visible');
    }

    function showDisconnectedUI() {
      document.getElementById('deviceName').style.display = 'none';
      document.getElementById('btnConnect').style.display = 'flex';
      document.getElementById('btnDisconnect').style.display = 'none';
      document.getElementById('connectTitle').textContent = 'Connect to BLE Device';
      document.getElementById('connectDesc').textContent = 'Tap to scan for nearby Bluetooth devices';
      document.getElementById('bleIconWrap').classList.remove('connected');
      document.getElementById('configRow').classList.remove('visible');
      document.getElementById('commandRow').classList.remove('visible');
      document.getElementById('audioPollingRow').classList.remove('visible');
      document.getElementById('wifiRow').classList.remove('visible');
      setStatus('idle', 'Disconnected');
    }

    function setWave(on) {
      document.getElementById('waveWrap').classList.toggle('speaking', on);
    }

    function addLog(msg, type = 'sys', time = null) {
      const scroll = document.getElementById('logScroll');
      const t = time || new Date().toLocaleTimeString('en-US', { hour12: false });
      const entry = document.createElement('div');
      entry.className = 'log-entry';

      const badgeMap = { ble: 'BLE', tts: 'VOICE', err: 'ERR', warn: 'WARN', sys: 'SYS' };
      const badge = document.createElement('span');
      badge.className = 'log-badge ' + (type === 'warn' ? 'sys' : type);
      badge.textContent = badgeMap[type] || 'SYS';

      const timeEl = document.createElement('span');
      timeEl.className = 'log-time';
      timeEl.textContent = t;

      const msgEl = document.createElement('span');
      msgEl.className = 'log-msg ' + type;
      msgEl.textContent = msg;

      entry.appendChild(badge);
      entry.appendChild(timeEl);
      entry.appendChild(msgEl);
      scroll.appendChild(entry);
      scroll.scrollTop = scroll.scrollHeight;
    }

    function clearLog() {
      document.getElementById('logScroll').innerHTML = '';
    }

    let toastTimer;
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
    }
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
